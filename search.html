<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Movie Database - Search</title>
        <link rel="stylesheet" href="./styles/style.css" />
        <script
            src="https://kit.fontawesome.com/f300007e95.js"
            crossorigin="anonymous"
        ></script>
        <script type="module" src="./scripts/script.js"></script>
    </head>
    <body>
        <header class="header">
            <div class="content-wrapper header__flex">
                <a href="index.html"
                    ><img
                        class="header__logo"
                        src="./res/logo.png"
                        alt="logotype"
                /></a>
            </div>
        </header>

        <!-- Search movies section -->
        <section>
            <div class="content-wrapper center center--search-results">
                <div class="center__search-results-title-wrapper">
                    <h2
                        class="center__search-results-title"
                        id="searchResultsTitle"
                    >
                        Search Results
                    </h2>
                </div>
                <div class="center__movies-container-wrapper">
                    <div class="center__movies-container"></div>
                </div>
            </div>
        </section>
    </body>
</html>
